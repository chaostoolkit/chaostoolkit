name: Build container images

on:
  # manual: package the latest chaostoolkit installable from PyPI, or the
  # given version. It is also tagged `latest`.
  workflow_dispatch:
    inputs:
      version:
        description: "chaostoolkit version to package (default: latest on PyPI)"
        required: false
        default: ""
  # called by the release workflow once the version is on PyPI
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the version to package
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ]; then
            # called by a release: package its tag
            version=$(git describe --tags --abbrev=0)
          elif [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
          else
            # what pip actually installs, not what the JSON API announces
            pip download --no-deps --quiet --dest /tmp/latest chaostoolkit
            version=$(basename /tmp/latest/chaostoolkit-*.whl | cut -d- -f2)
          fi
          echo "Packaging chaostoolkit ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Wait for the version to be installable from PyPI
        env:
          CTK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # the index pip reads can lag several minutes behind a publish
          for attempt in $(seq 120); do
            if pip download --no-deps --quiet --dest /tmp/ctk "chaostoolkit==${CTK_VERSION}"; then
              exit 0
            fi
            echo "chaostoolkit ${CTK_VERSION} not installable yet, retrying in 10s"
            sleep 10
          done
          echo "chaostoolkit ${CTK_VERSION} is not available on PyPI"
          exit 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta for 'basic' flavour
        id: metabasic
        uses: docker/metadata-action@v6
        with:
          images: |
            chaostoolkit/chaostoolkit
          tags: |
            type=raw,value=basic
          labels: |
            org.opencontainers.image.version=${{steps.version.outputs.version}}
      - name: Docker meta for 'full' flavour
        id: metafull
        uses: docker/metadata-action@v6
        with:
          images: |
            chaostoolkit/chaostoolkit
          tags: |
            type=raw,value=full
          labels: |
            org.opencontainers.image.version=${{steps.version.outputs.version}}
      - name: Docker meta for 'alpine' flavour
        id: alpine
        uses: docker/metadata-action@v6
        with:
          images: |
            chaostoolkit/chaostoolkit
          tags: |
            type=raw,value=latest
            type=raw,value=${{steps.version.outputs.version}}
          labels: |
            org.opencontainers.image.version=${{steps.version.outputs.version}}
      - name: Build and push chaostoolkit-basic
        uses: docker/build-push-action@v7
        with:
          context: ./container
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          file: ./container/Dockerfile-basic
          tags: ${{ steps.metabasic.outputs.tags }}
          labels: ${{ steps.metabasic.outputs.labels }}
          build-args: |
            CTK_VERSION=${{steps.version.outputs.version}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push chaostoolkit-full
        uses: docker/build-push-action@v7
        with:
          context: ./container
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          file: ./container/Dockerfile-full
          tags: ${{ steps.metafull.outputs.tags }}
          labels: ${{ steps.metafull.outputs.labels }}
          build-args: |
            CTK_VERSION=${{steps.version.outputs.version}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push chaostoolkit latest
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          tags: ${{ steps.alpine.outputs.tags }}
          labels: ${{ steps.alpine.outputs.labels }}
          build-args: |
            ctkversion=${{steps.version.outputs.version}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update repo description
        uses: peter-evans/dockerhub-description@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: chaostoolkit/chaostoolkit
          short-description: ${{ github.event.repository.description }}